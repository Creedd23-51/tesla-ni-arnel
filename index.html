<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TESLA NI ARNEL COMMAND CENTER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        body { overscroll-behavior-y: contain; touch-action: none; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
        .btn-press:active { transform: translateY(2px); border-bottom-width: 0px; margin-bottom: 2px; }

        .wasd-grid { display: grid; grid-template-columns: 60px 60px 60px; gap: 8px; justify-content: center; margin-top: 10px; }
        .key { width: 60px; height: 60px; background-color: #1e222b; border: 2px solid #374151; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; border-radius: 8px; font-size: 24px; transition: 0.1s; cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: none; }
        .key:active { background-color: #2b303c; }
        .key.active { background-color: var(--accent-yellow, #f59e0b); color: #000; border-color: var(--accent-yellow, #f59e0b); box-shadow: 0px 0px 15px rgba(245, 158, 11, 0.6); transform: scale(0.95); }
        .key-empty { visibility: hidden; }
    </style>
</head>

<body class="bg-[#0a0a0c] text-gray-300 font-sans h-screen w-full overflow-hidden selection:bg-cyan-900">

    <!-- SECURITY & INITIALIZATION OVERLAY -->
    <div id="setupOverlay" class="absolute inset-0 bg-[#0a0a0c] z-50 flex flex-col items-center justify-center p-4">
        <div class="bg-[#111318] border border-gray-800 p-6 rounded-md shadow-2xl w-full max-w-md">
            <div class="flex items-center gap-3 mb-6 border-b border-gray-700 pb-3">
                <div class="w-3 h-3 rounded-full bg-emerald-500 shadow-[0_0_8px_#10b981] animate-pulse"></div>
                <h2 class="text-xl font-black text-emerald-400 tracking-widest">SYSTEM INITIALIZATION</h2>
            </div>

            <label class="block text-[10px] font-bold text-gray-500 tracking-widest mb-1">ESP32-CAM IP ADDRESS</label>
            <input type="text" id="camIP" value="http://192.168.100.135:81/stream" class="w-full p-3 mb-4 bg-black rounded text-gray-300 border border-gray-700 focus:border-emerald-500 outline-none font-mono text-xs">

            <label class="block text-[10px] font-bold text-gray-500 tracking-widest mb-1">MQTT BROKER (WEBSOCKET)</label>
            <input type="text" id="mqttBroker" value="o20da71e.ala.asia-southeast1.emqxsl.com" class="w-full p-3 mb-4 bg-black rounded text-gray-300 border border-gray-700 focus:border-emerald-500 outline-none font-mono text-xs">

            <label class="block text-[10px] font-bold text-gray-500 tracking-widest mb-1">MQTT USERNAME</label>
            <input type="text" id="mqttUser" autocomplete="username" placeholder="Your EMQX username" class="w-full p-3 mb-4 bg-black rounded text-gray-300 border border-gray-700 focus:border-emerald-500 outline-none font-mono text-xs">

            <label class="block text-[10px] font-bold text-gray-500 tracking-widest mb-1">MQTT PASSWORD</label>
            <input type="password" id="mqttPass" autocomplete="current-password" placeholder="Your EMQX password" class="w-full p-3 mb-6 bg-black rounded text-gray-300 border border-gray-700 focus:border-emerald-500 outline-none font-mono text-xs">

            <button onclick="initializeDashboard()" class="w-full bg-emerald-900/40 hover:bg-emerald-900/70 text-emerald-400 border border-emerald-800 font-bold py-3 px-4 rounded transition-colors tracking-widest text-sm">
                ESTABLISH LINK
            </button>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="mainUI" class="hidden h-screen w-full flex-col">
        <div class="h-12 w-full border-b-2 border-emerald-500/50 flex justify-between items-center px-4 shrink-0 bg-[#0f1115]">
            <div class="flex items-center gap-4">
                <div class="w-3 h-3 rounded-full bg-emerald-500 shadow-[0_0_8px_#10b981] animate-pulse"></div>
                <h1 class="text-lg font-black text-emerald-400 tracking-[0.2em]">TESLA NI ARNEL</h1>
            </div>
            <div id="status" class="text-xs font-bold text-yellow-500 uppercase tracking-wider">MQTT: CONNECTING...</div>
        </div>

        <div class="flex-1 w-full p-4 grid grid-cols-1 lg:grid-cols-3 gap-4 min-h-0">
            <!-- CAMERA FEED -->
            <div class="lg:col-span-2 flex flex-col border border-gray-800 bg-black rounded-md relative h-full min-h-[40vh] shadow-lg overflow-hidden justify-center items-center">
                <div class="absolute top-0 w-full bg-gradient-to-b from-black/80 to-transparent p-3 z-10 flex justify-between">
                    <span class="text-[10px] font-mono text-emerald-400 border border-emerald-500/30 bg-black/50 px-2 py-1 rounded">ESP32-CAM LIVE STREAM</span>
                </div>
                <img id="videoFeed" src="" alt="Awaiting Video Feed..." class="object-cover w-full h-full text-center text-gray-700 text-sm font-mono" style="transform: rotate(180deg) scaleX(-1);">
            </div>

            <!-- CONTROLS -->
            <div class="flex flex-col gap-4 h-full overflow-y-auto pr-2 pb-4">
                <!-- SENSOR STATUS -->
                <div class="bg-[#111318] border border-gray-800 rounded-md p-4 shrink-0">
                    <div class="flex justify-between border-b border-gray-700 pb-2 mb-3">
                        <h2 class="text-[10px] font-bold text-gray-400 tracking-wider">SENSOR STATUS</h2>
                    </div>
                    <div class="grid grid-cols-2 gap-y-4 gap-x-2 text-center">
                        <div>
                            <div class="text-[9px] text-gray-500 tracking-widest uppercase mb-1">Current Action</div>
                            <div id="tel-action" class="text-xs font-mono text-emerald-400 font-bold">HOLD</div>
                        </div>
                        <div>
                            <div class="text-[9px] text-gray-500 tracking-widest uppercase mb-1">Obstacle Sonar</div>
                            <div id="tel-sonar" class="text-xs font-mono text-emerald-400 font-bold">CLEAR</div>
                        </div>
                        <div>
                            <div class="text-[9px] text-gray-500 tracking-widest uppercase mb-1">IR Sensor (L-C-R)</div>
                            <div id="tel-ir" class="text-xs font-mono text-white font-bold flex justify-center gap-1">
                                <span id="ir-l" class="w-3 h-3 rounded-full bg-gray-700 border border-gray-500"></span>
                                <span id="ir-c" class="w-3 h-3 rounded-full bg-gray-700 border border-gray-500"></span>
                                <span id="ir-r" class="w-3 h-3 rounded-full bg-gray-700 border border-gray-500"></span>
                            </div>
                        </div>
                        <div>
                            <div class="text-[9px] text-gray-500 tracking-widest uppercase mb-1">System Mode</div>
                            <div id="tel-mode" class="text-xs font-mono text-emerald-400 font-bold">MANUAL ACTIVE</div>
                        </div>
                    </div>
                </div>

                <!-- DRIVING CONTROLS -->
                <div class="bg-[#111318] border border-gray-800 rounded-md p-4 shrink-0 flex flex-col items-center">
                    <div class="grid grid-cols-2 gap-2 w-full max-w-[260px] mb-2">
                        <button id="btn-manual" onclick="toggleMainMode('MANUAL')" class="btn-press bg-blue-600/50 text-blue-300 border border-blue-400 py-3 rounded text-[11px] font-bold tracking-wider transition-colors duration-200">MANUAL MODE</button>
                        <button id="btn-auto" onclick="toggleMainMode('AUTO')" class="btn-press bg-emerald-900/30 text-emerald-400 border border-emerald-800 py-3 rounded text-[11px] font-bold tracking-wider transition-colors duration-200">AUTO MODE</button>
                    </div>

                    <!-- MANUAL D-PAD -->
                    <div id="manualControlsUI" class="w-full max-w-[260px] mb-4 text-center">
                        <div class="wasd-grid">
                            <div class="key key-empty"></div>
                            <div class="key text-gray-300" id="keyW"
                                onpointerdown="startDrive('F', 'keyW', event)"
                                onpointerup="stopDrive('keyW', event)"
                                onpointerleave="stopDrive('keyW', event)"
                                onpointercancel="stopDrive('keyW', event)"
                                oncontextmenu="return false;">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 15l7-7 7 7"></path></svg>
                            </div>
                            <div class="key key-empty"></div>
                            <div class="key text-gray-300" id="keyA"
                                onpointerdown="startDrive('L', 'keyA', event)"
                                onpointerup="stopDrive('keyA', event)"
                                onpointerleave="stopDrive('keyA', event)"
                                onpointercancel="stopDrive('keyA', event)"
                                oncontextmenu="return false;">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7"></path></svg>
                            </div>
                            <div class="key text-gray-300" id="keyS"
                                onpointerdown="startDrive('B', 'keyS', event)"
                                onpointerup="stopDrive('keyS', event)"
                                onpointerleave="stopDrive('keyS', event)"
                                onpointercancel="stopDrive('keyS', event)"
                                oncontextmenu="return false;">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M19 9l-7 7-7-7"></path></svg>
                            </div>
                            <div class="key text-gray-300" id="keyD"
                                onpointerdown="startDrive('R', 'keyD', event)"
                                onpointerup="stopDrive('keyD', event)"
                                onpointerleave="stopDrive('keyD', event)"
                                onpointercancel="stopDrive('keyD', event)"
                                oncontextmenu="return false;">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7"></path></svg>
                            </div>
                        </div>
                    </div>

                    <!-- AUTONOMOUS OPTIONS -->
                    <div id="auto-options" class="hidden flex-col gap-2 w-full max-w-[260px] mb-4 transition-all duration-300">
                        <button onclick="activateAuto('C')" class="btn-press bg-cyan-900/40 hover:bg-cyan-900/70 text-cyan-300 border border-cyan-700 py-3 rounded text-[11px] font-bold tracking-wider">LINE FOLLOWING ONLY</button>
                        <button onclick="activateAuto('A')" class="btn-press bg-teal-900/40 hover:bg-teal-900/70 text-teal-300 border border-teal-700 py-3 rounded text-[11px] font-bold tracking-wider">OBSTACLE DETECTING WITH LINE FOLLOWING</button>
                    </div>

                    <!-- EMERGENCY STOP -->
                    <button onclick="stopAllDrive(); sendCmd('H')" class="btn-press w-full max-w-[260px] bg-red-900/40 hover:bg-red-900/70 text-red-400 border border-red-800 py-3 rounded text-sm font-bold tracking-wider">EMERGENCY STOP</button>
                </div>

                <!-- COMMAND ACTIVITY LOG -->
                <div class="bg-[#0a0a0c] border border-gray-800 rounded-md p-3 flex-1 min-h-[120px] flex flex-col">
                    <div class="flex justify-between pb-1 mb-2">
                        <h2 class="text-[10px] font-bold text-gray-500 tracking-wider">COMMAND ACTIVITY LOG</h2>
                    </div>
                    <div id="terminal" class="flex-1 overflow-y-auto text-[10px] font-mono text-gray-400 space-y-1">
                        <div>> System initialized...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        var mqttClient = null;
        var currentMode = "MANUAL";
        var driveInterval = null;
        var activeDriveKey = null;
        var activeDriveCommand = null;
        var lastLoggedCmd = "";

        function logTerminal(msg, type = "info") {
            const terminal = document.getElementById("terminal");
            const time = new Date().toLocaleTimeString([], { hour12: false });
            let color = type === "cmd" ? "text-cyan-400" : type === "alert" ? "text-red-400" : "text-gray-400";
            terminal.innerHTML += `<div class="${color}">[${time}] > ${msg}</div>`;
            terminal.scrollTop = terminal.scrollHeight;
        }

        function initializeDashboard() {
            const brokerHost = document.getElementById('mqttBroker').value.trim();
            const username = document.getElementById('mqttUser').value.trim();
            const password = document.getElementById('mqttPass').value;

            if (!brokerHost || !username || !password) {
                alert("Enter the MQTT hostname, username, and password.");
                return;
            }

            document.getElementById('videoFeed').src = document.getElementById('camIP').value;
            document.getElementById('setupOverlay').classList.add('hidden');
            document.getElementById('mainUI').classList.remove('hidden');
            document.getElementById('mainUI').classList.add('flex');

            document.getElementById("status").innerText = "MQTT: CONNECTING...";
            document.getElementById("status").className = "text-xs font-bold text-yellow-500";

            const clientId = "STEER_Dash_" + Math.random().toString(16).slice(2, 12);

            // EMQX WebSockets standard port
            mqttClient = new Paho.MQTT.Client(brokerHost, 8084, "/mqtt", clientId);

            mqttClient.onConnectionLost = function(response) {
                stopAllDrive();
                document.getElementById("status").innerText = "MQTT: DISCONNECTED";
                document.getElementById("status").className = "text-xs font-bold text-red-500";
                logTerminal("Connection lost: " + ((response && response.errorMessage) || "Unknown error"), "alert");
            };

            mqttClient.onMessageArrived = function(message) {
                let payload = message.payloadString;

                if (payload.startsWith("IR:")) {
                    let irVals = payload.replace("IR:", "").split(",");
                    let on = "bg-emerald-500 shadow-[0_0_8px_#10b981] border-emerald-400";
                    let off = "bg-gray-700 border-gray-500";
                    document.getElementById("ir-l").className = "w-3 h-3 rounded-full border " + (irVals[0].trim() === "1" ? on : off);
                    document.getElementById("ir-c").className = "w-3 h-3 rounded-full border " + (irVals[1].trim() === "1" ? on : off);
                    document.getElementById("ir-r").className = "w-3 h-3 rounded-full border " + (irVals[2].trim() === "1" ? on : off);
                } else if (payload.includes("OBSTACLE")) {
                    document.getElementById("tel-sonar").innerText = "BLOCKED";
                    document.getElementById("tel-sonar").className = "text-xs font-mono text-red-500 font-bold animate-pulse";
                } else if (payload.includes("CLEAR")) {
                    document.getElementById("tel-sonar").innerText = "CLEAR";
                    document.getElementById("tel-sonar").className = "text-xs font-mono text-emerald-400 font-bold";
                } else {
                    document.getElementById("tel-action").innerText = payload;
                }
            };

            mqttClient.connect({
                useSSL: true,
                userName: username,
                password: password,
                timeout: 10,
                onSuccess: function() {
                    document.getElementById("status").innerText = "MQTT: CONNECTED";
                    document.getElementById("status").className = "text-xs font-bold text-emerald-500";
                    logTerminal("Connected to EMQX Cloud!", "cmd");
                    mqttClient.subscribe("TESLANIARNEL/telemetry");
                },
                onFailure: function(error) {
                    document.getElementById("status").innerText = "MQTT: CONNECTION FAILED";
                    document.getElementById("status").className = "text-xs font-bold text-red-500";
                    logTerminal("MQTT connection failed: " + ((error && error.errorMessage) || "Check credentials."), "alert");
                }
            });
        }

        function startDrive(command, keyId, event) {
            if (currentMode !== "MANUAL") return;
            if (!mqttClient || !mqttClient.isConnected()) {
                logTerminal("MQTT is not connected!", "alert");
                return;
            }

            if (event) event.preventDefault();

            if (activeDriveKey === keyId) return;
            if (activeDriveKey !== null) stopDrive(activeDriveKey);

            activeDriveKey = keyId;
            activeDriveCommand = command;

            const el = document.getElementById(keyId);
            if (el) el.classList.add("active");

            sendCmd(command);

            // Repeat command to keep the Arduino watchdog alive.
        driveInterval = setInterval(function() {
            if (
                activeDriveKey === keyId &&
                currentMode === "MANUAL" &&
                mqttClient &&
                mqttClient.isConnected()
            ) {
                sendCmd(command);
            }
        }, 600);
        }

        function stopDrive(keyId, event) {
            if (event) event.preventDefault();
            if (activeDriveKey !== keyId) return;

            if (driveInterval !== null) {
                clearInterval(driveInterval);
                driveInterval = null;
            }

            const el = document.getElementById(keyId);
            if (el) el.classList.remove("active");

            activeDriveKey = null;
            activeDriveCommand = null;
            sendCmd("H");
        }

        function stopAllDrive() {
            if (activeDriveKey !== null) stopDrive(activeDriveKey);
            else {
                if (driveInterval !== null) {
                    clearInterval(driveInterval);
                    driveInterval = null;
                }
                activeDriveCommand = null;
            }
        }

        function sendCmd(command) {
            if (!mqttClient || !mqttClient.isConnected()) return;

            let message = new Paho.MQTT.Message(command);
            message.destinationName = "TESLANIARNEL/cmd";
            mqttClient.send(message);

            if (command !== lastLoggedCmd) {
                let name = command === 'F' ? "FORWARD" : command === 'B' ? "REVERSE" : command === 'L' ? "LEFT" : command === 'R' ? "RIGHT" : "HOLD/STOP";
                logTerminal("Command Sent: " + name, "cmd");
                lastLoggedCmd = command;
            }
        }

        function toggleMainMode(mode) {
            stopAllDrive();
            currentMode = mode;
            sendCmd("H");
            document.getElementById("manualControlsUI").classList.toggle("hidden", mode !== "MANUAL");
            document.getElementById("auto-options").classList.toggle("hidden", mode === "MANUAL");
            document.getElementById("auto-options").classList.toggle("flex", mode !== "MANUAL");
            document.getElementById("tel-mode").innerText = mode === "MANUAL" ? "MANUAL ACTIVE" : "AUTO (WAITING)";
        }

        function activateAuto(command) {
            stopAllDrive();
            if (!mqttClient || !mqttClient.isConnected()) {
                logTerminal("MQTT is not connected!", "alert");
                return;
            }
            sendCmd(command);
            document.getElementById("tel-mode").innerText = command === "C" ? "LINE FOLLOW ONLY" : "LINE + OBSTACLE";
        }

        function isTypingTarget(event) {
            const target = event.target;
            return (target.tagName === "INPUT" || target.tagName === "TEXTAREA" || target.tagName === "SELECT" || target.isContentEditable);
        }

        document.addEventListener("keydown", function(event) {
            if (isTypingTarget(event) || currentMode !== "MANUAL" || event.repeat) return;
            let key = event.key.toLowerCase();

            if (["w", "a", "s", "d", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(key)) {
                event.preventDefault();
                if (key === "w" || key === "arrowup") startDrive("F", "keyW");
                if (key === "s" || key === "arrowdown") startDrive("B", "keyS");
                if (key === "a" || key === "arrowleft") startDrive("L", "keyA");
                if (key === "d" || key === "arrowright") startDrive("R", "keyD");
            } else if (key === " ") {
                event.preventDefault();
                stopAllDrive();
                sendCmd("H");
            }
        });

        document.addEventListener("keyup", function(event) {
            if (isTypingTarget(event) || currentMode !== "MANUAL") return;
            let key = event.key.toLowerCase();
            if (key === "w" || key === "arrowup") stopDrive("keyW");
            if (key === "s" || key === "arrowdown") stopDrive("keyS");
            if (key === "a" || key === "arrowleft") stopDrive("keyA");
            if (key === "d" || key === "arrowright") stopDrive("keyD");
        });

        window.addEventListener("blur", function() { stopAllDrive(); });
        document.addEventListener("contextmenu", function(event) { if (event.target.closest(".key")) event.preventDefault(); });
    </script>
</body>
</html>
